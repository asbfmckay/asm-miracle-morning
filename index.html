<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FCFAF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miracle Morning">
<title>Miracle Morning</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFAF6;
    --glass:rgba(255,255,255,.75);
    --glass-strong:rgba(255,255,255,.82);
    --glass-line:rgba(255,255,255,.7);
    --line:rgba(46,43,40,.07);
    --ink:#26241F;
    --ink-dim:#77716A;
    --ink-faint:#ABA59C;
    --accent:#D9A520;
    --accent-soft:#F7E4A6;
    --danger:#B9636B;
    --c-silence:#93AE74;
    --c-affirm:#6EA88B;
    --c-visual:#6AA3B3;
    --c-exercise:#7C98BF;
    --c-reading:#9888BE;
    --c-scribing:#C48DA2;
    --font:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --tabbar-h:66px;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
    --shadow:0 1px 2px rgba(46,43,40,.04), 0 8px 24px rgba(46,43,40,.06);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font); font-weight:400;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; min-height:100dvh;
  }
  button{ font-family:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  #app{ max-width:520px; margin:0 auto; min-height:100dvh; position:relative; z-index:1; }

  /* ---------- Drifting colour background ---------- */
  .aurora{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; background:var(--bg); }
  .aurora i{
    position:absolute; display:block; border-radius:50%; filter:blur(70px); opacity:.5;
    will-change:transform; transition:background-color 1.6s ease;
  }
  .aurora i:nth-child(1){ width:46vmax; height:46vmax; left:-18vmax; top:-24vmax; background:#F7DE85; animation:drift1 16s ease-in-out infinite alternate; }
  .aurora i:nth-child(2){ width:60vmax; height:60vmax; right:-28vmax; top:-18vmax; background:#F6EFE2; animation:drift2 19s ease-in-out infinite alternate; }
  .aurora i:nth-child(3){ width:55vmax; height:55vmax; left:-20vmax; bottom:-34vmax; background:#F8F2E8; animation:drift3 21s ease-in-out infinite alternate; opacity:.55; }
  .aurora i:nth-child(4){ width:50vmax; height:50vmax; right:-24vmax; bottom:-26vmax; background:#F4ECDD; animation:drift4 17s ease-in-out infinite alternate; opacity:.55; }
  @keyframes drift1{ 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(14vw,8vh) scale(1.12);} 100%{transform:translate(4vw,16vh) scale(.95);} }
  @keyframes drift2{ 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(-12vw,12vh) scale(.9);} 100%{transform:translate(-4vw,22vh) scale(1.1);} }
  @keyframes drift3{ 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(16vw,-10vh) scale(1.1);} 100%{transform:translate(8vw,-4vh) scale(.92);} }
  @keyframes drift4{ 0%{transform:translate(0,0) scale(1);} 50%{transform:translate(-14vw,-14vh) scale(1.08);} 100%{transform:translate(-20vw,-4vh) scale(1);} }
  @media (prefers-reduced-motion: reduce){ .aurora i{ animation:none; } }

  /* ---------- Header ---------- */
  .hero{ position:relative; padding:calc(10px + var(--safe-t)) 22px 12px; }
  .hero-top{ display:flex; align-items:center; justify-content:space-between; height:42px; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:500; font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); }
  .brand svg{ width:26px; height:19px; color:var(--accent); }
  .streak-chip{
    display:flex; align-items:center; gap:6px; background:var(--glass); border:1px solid var(--glass-line);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-radius:999px; padding:7px 14px 7px 11px; font-weight:500; font-size:14.5px; color:var(--ink);
  }
  .streak-chip svg{ width:15px; height:15px; color:var(--accent); }
  .streak-chip.gold{ background:var(--accent-soft); }
  .hero-date{ margin-top:8px; font-weight:400; font-size:13.5px; color:var(--ink-dim); }
  .hero-title{ font-weight:500; font-size:28px; line-height:1.15; margin-top:4px; letter-spacing:-.02em; }
  .hero-sub{ font-weight:300; font-size:15px; color:var(--ink-dim); margin-top:6px; }

  /* ---------- Views ---------- */
  .view{ display:none; padding:0 18px calc(var(--tabbar-h) + var(--safe-b) + 84px); }
  .view.active{ display:block; animation:viewIn .55s cubic-bezier(.2,.7,.2,1); }
  #view-affirmations, #view-goals, #view-more{ padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 28px); }
  @keyframes viewIn{ from{opacity:0; transform:translateY(14px); filter:blur(6px);} to{opacity:1; transform:none; filter:none;} }
  .hero.swap{ animation:viewIn .55s cubic-bezier(.2,.7,.2,1); }

  .glass{
    background:var(--glass); border:1px solid var(--glass-line); border-radius:24px; box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(18px) saturate(1.2); backdrop-filter:blur(18px) saturate(1.2);
  }

  /* Plan card */
  .plan-card{ padding:10px; }
  .seg{ display:flex; background:rgba(46,43,40,.05); border-radius:14px; padding:4px; gap:4px; }
  .seg button{
    flex:1; border:none; background:transparent; color:var(--ink-dim);
    font-weight:400; font-size:14px; padding:10px 0; border-radius:11px; cursor:pointer; transition:all .25s;
  }
  .seg button.active{ background:#fff; color:var(--ink); font-weight:500; box-shadow:0 1px 3px rgba(46,43,40,.08); }
  .plan-meta{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:10px; padding:0 6px 2px; }
  .plan-meta .big{ font-weight:400; font-size:26px; line-height:1; letter-spacing:-.02em; }
  .plan-meta .lbl{ font-size:11.5px; font-weight:400; color:var(--ink-faint); margin-top:6px; letter-spacing:.06em; text-transform:uppercase; }
  .plan-meta .right{ text-align:right; }

  /* SAVERS list */
  .savers{ margin-top:10px; padding:2px 14px; }
  .saver{ display:flex; align-items:center; gap:14px; padding:7px 0; border-bottom:1px solid var(--line); }
  .saver:last-child{ border-bottom:none; }
  .tile{
    width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--c); background:color-mix(in srgb, var(--c) 13%, white);
  }
  .tile svg{ width:23px; height:23px; }
  .saver-text{ flex:1; min-width:0; }
  .saver-name{ font-weight:500; font-size:17px; line-height:1.2; letter-spacing:-.01em; }
  .saver-sub{ font-size:13px; font-weight:300; color:var(--ink-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .check{
    width:30px; height:30px; border-radius:50%; border:1.5px solid rgba(46,43,40,.14); background:transparent;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; padding:0; transition:all .3s;
  }
  .check svg{ width:15px; height:15px; color:#fff; opacity:0; transform:scale(.6); transition:all .3s; }
  .check.done{ border-color:transparent; background:var(--c); }
  .check.done svg{ opacity:1; transform:none; }
  .check.pop{ animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop{ 0%{transform:scale(.7);} 100%{transform:scale(1);} }
  .bubble{ position:absolute; bottom:-60px; border-radius:50%; pointer-events:none; opacity:0; filter:blur(.5px); animation:rise-b linear forwards; z-index:0; }
  @keyframes rise-b{ 0%{ transform:translateY(0) scale(.6); opacity:0; } 15%{ opacity:.85; } 100%{ transform:translateY(-110vh) scale(1.1); opacity:0; } }

  /* Start button */
  .start-wrap{
    position:fixed; left:0; right:0; bottom:calc(var(--tabbar-h) + var(--safe-b)); z-index:15;
    max-width:520px; margin:0 auto; padding:8px 18px 10px;
  }
  .btn-start{
    width:100%; border:none; border-radius:20px; color:var(--ink);
    background:linear-gradient(180deg, #F1DA94, #E8CB78);
    font-weight:500; font-size:16.5px; padding:15px; cursor:pointer; letter-spacing:.01em;
    box-shadow:0 6px 18px rgba(200,160,60,.18);
    display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .15s;
  }
  .btn-start:active{ transform:scale(.98); }
  .btn-start svg{ width:14px; height:14px; color:var(--ink); }
  @keyframes sheen{ from{background-position:0% 50%;} to{background-position:100% 50%;} }

  /* Tab bar */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:520px; margin:0 auto;
    background:rgba(255,255,255,.82); border-top:1px solid var(--line);
    -webkit-backdrop-filter:blur(20px) saturate(1.3); backdrop-filter:blur(20px) saturate(1.3);
    display:flex; padding:6px 6px calc(6px + var(--safe-b)); height:calc(var(--tabbar-h) + var(--safe-b));
  }
  .tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--ink-faint); font-weight:400; font-size:11.5px; cursor:pointer; transition:color .25s;
  }
  .tabbar button svg{ width:22px; height:22px; }
  .tabbar button.active{ color:var(--ink); font-weight:500; }
  .tabbar button.active .tab-ic{ background:var(--accent-soft); }
  .tab-ic{ width:50px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; transition:background .3s; }

  /* Cards / inputs */
  .card{ padding:4px 16px; }
  .section-label{ font-size:11.5px; font-weight:500; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-faint); margin:24px 6px 9px; }
  .section-label:first-child{ margin-top:4px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row-title{ font-weight:500; font-size:15px; }
  .row-sub{ font-weight:300; font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  input[type=text], input[type=url]{
    width:100%; border:1px solid var(--line); background:rgba(255,255,255,.7); border-radius:14px;
    padding:13px 14px; font-family:inherit; font-weight:400; font-size:15px; color:var(--ink); outline:none; transition:border-color .2s;
  }
  input:focus, textarea:focus{ border-color:var(--accent); background:#fff; }
  textarea{
    width:100%; min-height:340px; border:1px solid var(--line); background:var(--glass-strong); border-radius:20px;
    padding:16px; font-family:inherit; font-weight:400; font-size:15px; line-height:1.6; color:var(--ink); resize:vertical; outline:none;
  }
  .help{ font-size:12.5px; font-weight:300; color:var(--ink-dim); line-height:1.5; margin:8px 6px 0; }
  .btn{ border:none; border-radius:16px; padding:14px 16px; font-weight:500; font-size:14.5px; cursor:pointer; transition:transform .15s; }
  .btn:active{ transform:scale(.98); }
  .btn-ink{ background:linear-gradient(180deg, #F1DA94, #E8CB78); color:var(--ink); box-shadow:0 6px 18px rgba(200,160,60,.18); }
  .btn-soft{ background:var(--glass-strong); color:var(--ink); border:1px solid var(--line); }
  .btn-danger{ background:var(--glass); color:var(--danger); border:1px solid var(--line); }
  .btn-row{ display:flex; gap:10px; margin-top:12px; }
  .btn-install{ flex-shrink:0; padding:10px 18px; border-radius:999px; background:linear-gradient(180deg, #F1DA94, #E8CB78); color:var(--ink); }
  .btn-row > *{ flex:1; }

  .switch{ position:relative; width:48px; height:28px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch span{ position:absolute; inset:0; background:rgba(46,43,40,.12); border-radius:999px; transition:.3s; cursor:pointer; }
  .switch span:before{ content:""; position:absolute; width:22px; height:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.3s; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .switch input:checked + span{ background:var(--accent); }
  .switch input:checked + span:before{ transform:translateX(20px); }

  .dur-input{
    width:62px; text-align:right; border:1px solid var(--line); background:rgba(255,255,255,.7); border-radius:11px;
    padding:8px 10px; font-family:inherit; font-weight:400; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums;
  }
  .settings-saver{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .settings-saver:last-child{ border-bottom:none; }
  .settings-saver .tile{ width:36px; height:36px; border-radius:11px; }
  .settings-saver .tile svg{ width:19px; height:19px; }
  .settings-saver .nm{ flex:1; font-weight:400; font-size:15px; }
  .settings-saver .unit{ font-size:12.5px; font-weight:300; color:var(--ink-faint); }
  .seg.light{ background:var(--glass); border:1px solid var(--glass-line); }

  .aff-item{ padding:15px 0; border-bottom:1px solid var(--line); font-weight:300; font-size:15.5px; line-height:1.6; color:var(--ink-dim); display:flex; gap:14px; }
  .aff-item:last-child{ border-bottom:none; }
  .aff-item.aff-head{ font-weight:500; color:var(--ink); font-size:13px; text-transform:uppercase; letter-spacing:.12em; padding:20px 0 6px; border-bottom:none; }
  .aff-item.aff-head:first-child{ padding-top:12px; }
  .aff-item strong{ color:var(--ink); font-weight:500; }

  .goals-frame{ overflow:hidden; height:62vh; min-height:420px; padding:0; }
  .goals-frame iframe{ width:100%; height:100%; border:none; display:block; border-radius:24px; }
  .about{ margin:24px 6px 0; font-size:12px; font-weight:300; color:var(--ink-faint); line-height:1.6; }

  /* ---------- Session ---------- */
  #session{
    position:fixed; inset:0; z-index:50; display:none; flex-direction:column; color:var(--ink);
    padding:calc(12px + var(--safe-t)) 18px calc(18px + var(--safe-b)); background:var(--bg);
  }
  #session.active{ display:flex; animation:sessIn .6s cubic-bezier(.2,.7,.2,1); }
  @keyframes sessIn{ from{opacity:0;} to{opacity:1;} }
  #session .aurora{ position:absolute; z-index:0; }
  #session .aurora i{ opacity:.6; }
  #session .inner{ position:relative; z-index:1; max-width:520px; width:100%; margin:0 auto; display:flex; flex-direction:column; flex:1; min-height:0; }
  .s-top{ display:flex; align-items:center; justify-content:space-between; }
  .s-count{ font-weight:400; font-size:12.5px; letter-spacing:.16em; color:var(--ink-dim); }
  .glass-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-line); background:var(--glass); color:var(--ink);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all .25s;
  }
  .glass-btn svg{ width:18px; height:18px; opacity:.85; }
  .glass-btn:disabled{ opacity:.35; cursor:default; }
  .glass-btn.on{ background:var(--accent-soft); color:#7A5A10; border-color:transparent; }

  .overall{ margin-top:14px; padding:13px 16px; border-radius:22px; }
  .ov-bar{ display:flex; gap:4px; height:5px; }
  .ov-seg{ flex:1; background:rgba(46,43,40,.08); border-radius:999px; overflow:hidden; }
  .ov-seg i{ display:block; height:100%; width:0; border-radius:999px; transition:width .3s linear; }
  .ov-stats{ display:flex; justify-content:space-between; margin-top:11px; }
  .ov-stat .v{ font-weight:400; font-size:19px; font-variant-numeric:tabular-nums; line-height:1.1; letter-spacing:-.01em; }
  .ov-stat .k{ font-weight:400; font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-faint); margin-top:3px; }
  .ov-stat.mid{ text-align:center; }
  .ov-stat.end{ text-align:right; }

  .s-body{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px 2px 8px; -webkit-overflow-scrolling:touch; }
  .s-body.enter > *{ animation:viewIn .7s cubic-bezier(.2,.7,.2,1) both; }
  .s-body.enter > *:nth-child(2){ animation-delay:.05s; } .s-body.enter > *:nth-child(3){ animation-delay:.1s; }
  .s-body.enter > *:nth-child(4){ animation-delay:.15s; } .s-body.enter > *:nth-child(n+5){ animation-delay:.2s; }
  .s-tile{ width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:var(--step); background:color-mix(in srgb, var(--step) 13%, white); }
  .s-tile svg{ width:25px; height:25px; }
  .s-name{ font-weight:500; font-size:32px; margin-top:12px; letter-spacing:-.025em; line-height:1.05; }
  .s-sub{ font-weight:300; font-size:15px; color:var(--ink-dim); margin-top:5px; }
  .ring-wrap{ position:relative; width:min(64vw, 256px); aspect-ratio:1; margin-top:18px; flex-shrink:0; }
  .ring-wrap.compact{ width:min(40vw, 156px); margin-top:14px; }
  .ring-wrap:before{ content:""; position:absolute; inset:10%; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--step) 26%, transparent), transparent 70%); filter:blur(10px); animation:breathe 5s ease-in-out infinite; }
  #session.is-paused .ring-wrap:before{ animation-play-state:paused; opacity:.4; }
  @keyframes breathe{ 0%,100%{ transform:scale(.88); opacity:.6; } 50%{ transform:scale(1.12); opacity:1; } }
  .ring-wrap svg{ position:relative; width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ stroke:rgba(46,43,40,.06); }
  .ring-fill{ transition:stroke-dashoffset .3s linear; }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .clock{ font-weight:300; font-size:clamp(46px, 15vw, 62px); font-variant-numeric:tabular-nums; letter-spacing:-.03em; line-height:1; }
  .ring-wrap.compact .clock{ font-size:34px; }
  .clock-of{ font-weight:300; font-size:13px; color:var(--ink-faint); margin-top:6px; }
  .ring-wrap.compact .clock-of{ font-size:11px; margin-top:3px; }
  .paused-tag{ font-weight:500; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); background:rgba(46,43,40,.06); padding:4px 10px; border-radius:999px; margin-top:8px; display:none; }
  #session.is-paused .paused-tag{ display:inline-block; }
  #session.is-paused .clock{ opacity:.55; }

  .s-instr{ font-weight:300; font-size:16.5px; line-height:1.6; max-width:330px; margin-top:20px; color:var(--ink-dim); }
  .s-list{ list-style:none; margin:16px 0 0; padding:0; width:100%; max-width:320px; display:flex; flex-direction:column; gap:8px; }
  .s-list li{ padding:14px; font-weight:400; font-size:17px; border-radius:18px; }
  .s-aff{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:16px; text-align:left; }
  .s-aff div{ color:var(--ink-dim); border-radius:20px; padding:15px 17px; font-weight:300; font-size:16px; line-height:1.6; }
  .s-aff strong{ color:var(--ink); font-weight:500; }
  .s-aff div.s-aff-head{ background:none; border:none; box-shadow:none; padding:10px 4px 0; font-weight:500; font-size:12.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-faint); }
  .s-link{
    margin-top:18px; display:inline-flex; align-items:center; gap:8px; color:var(--ink);
    border-radius:999px; padding:11px 18px; font-weight:400; font-size:14px; text-decoration:none;
  }
  .s-link svg{ width:14px; height:14px; color:var(--step); }
  .s-link.soon{ color:var(--ink-faint); }

  .s-controls{ display:flex; align-items:center; justify-content:space-between; padding-top:12px; flex-shrink:0; }
  .s-controls .glass-btn.md{ width:54px; height:54px; }
  .s-controls .glass-btn.md svg{ width:21px; height:21px; }
  .play-btn{
    width:76px; height:76px; border-radius:50%; border:1px solid rgba(255,255,255,.8); color:#fff;
    background:linear-gradient(180deg, color-mix(in srgb, var(--step) 85%, white), var(--step)); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 10px 26px color-mix(in srgb, var(--step) 30%, transparent); transition:transform .15s, background .6s;
  }
  .play-btn:active{ transform:scale(.95); }
  .play-btn svg{ width:24px; height:24px; }

  /* Complete */
  .complete{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .complete .sunburst{ width:96px; height:70px; color:var(--accent); }

    var m = String(t).match(/^(\d?\s?[A-Za-z][A-Za-z ]*?)\s+(\d+):\s?(\d+)(?:\s?–\s?(\d+))?/); if(!m) return null;
    var b = bookIdx(m[1].trim()); if(b < 0) return null;

  }
  function chLabel(list){ // [[b,c],...] → "Genesis 4–6, Matthew 2"
    var out = [], i = 0;
    while(i < list.length){
      var b = list[i][0], c0 = list[i][1], c1 = c0;
      while(i + 1 < list.length && list[i + 1][0] === b && list[i + 1][1] === c1 + 1){ i++; c1++; }
      out.push((b === PS ? (c0 === c1 ? "Psalm" : "Psalms") : BOOKS[b][0]) + " " + c0 + (c1 > c0 ? "–" + c1 : "")); i++;

    return out.join(", ");
  }
  function seeded(str){ var h = 1779033703 ^ str.length; for(var i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }

  function nowHour(){ var d = new Date(); return d.getHours() + d.getMinutes() / 60; }

  /* ---------- Morning Bible plan (personal) ---------- */
  function rplan(){ return get(mySpace(), "rplan"); }
  function planStreams(p){
    var books = (p.books || []).slice();
    if(p.order === "chrono") books.sort(function(a, b){ return CHRONO.indexOf(BOOKS[a][0]) - CHRONO.indexOf(BOOKS[b][0]); }); else books.sort(function(a, b){ return a - b; });
    var chs = function(bs){ var o = []; bs.forEach(function(b){ for(var c = 1; c <= BOOKS[b][1].length; c++) o.push([b, c]); }); return o; };
    var streams = p.order === "blend" ? [chs(books.filter(function(b){ return b < 39; })), chs(books.filter(function(b){ return b >= 39; }))].filter(function(s){ return s.length; }) : [chs(books)];
    return streams.map(function(s){ return { list:s, perDay:p.perDay ? Math.max(1, +p.perDay) : Math.max(1, Math.ceil(s.length / Math.max(1, p.days || 365))) }; });
  }
  function planToday(p){
    var done = p.done || {}, t = today(), chs = [];
    planStreams(p).forEach(function(s){
      var mine = s.list.filter(function(x){ return done[x[0] + ":" + x[1]] === t; });
      var need = Math.max(0, s.perDay - mine.length);
      s.list.forEach(function(x){ if(need > 0 && !done[x[0] + ":" + x[1]]){ mine.push(x); need--; } });
      chs = chs.concat(mine.sort(function(a, b){ return s.list.indexOf(a) - s.list.indexOf(b); }));
    });
    return chs;
  }
  function planStats(p){
    var ss = planStreams(p), total = 0, done = 0, expected = 0, el = Math.max(0, daysBetween(p.start || today(), today()));
    ss.forEach(function(s){ total += s.list.length; expected += Math.min(s.list.length, s.perDay * el); s.list.forEach(function(x){ if(p.done && p.done[x[0] + ":" + x[1]]) done++; }); });
    var doneBefore = 0; ss.forEach(function(s){ s.list.forEach(function(x){ var d = p.done && p.done[x[0] + ":" + x[1]]; if(d && d < today()) doneBefore++; }); });
    return { total:total, done:done, behind:Math.max(0, expected - doneBefore), pct:total ? Math.round(done / total * 100) : 0 };
  }
  function morningDone(){ var p = rplan(); if(!p) return false; var tl = planToday(p); return tl.length > 0 && tl.every(function(x){ return (p.done || {})[x[0] + ":" + x[1]]; }); }
  function tickMorning(on){
    var p = rplan(); if(!p) return; var d = Object.assign({}, p.done || {}), t = today();
    planToday(p).forEach(function(x){ var k = x[0] + ":" + x[1]; if(on) d[k] = d[k] || t; else if(d[k] === t) delete d[k]; });

  }
  function morningLink(){

    return bibleUrl(first[0], first[1], 0, 0, "am", tl.map(function(x){ return x[0] + ":" + x[1]; }).join(","));
  }

  /* ---------- Lunchtime Proverb (personal, a random group of 5–10 verses, same all day) ---------- */
  function proverbFor(date){
    var r = seeded("pv|" + myUid() + "|" + date), c = 1 + Math.floor(r() * 31), n = BOOKS[PR][1][c - 1];
    var len = 5 + Math.floor(r() * 6), v = 1 + Math.floor(r() * Math.max(1, n - len + 1));

  /* ---------- Tonight's Psalm (household, methodical from Psalm 1:1, about 10 verses) ---------- */
  var PSEQ = (function(){

      for(var j = 0; j < k; j++){ var len = size || Math.floor(n / k) + (j < n % k ? 1 : 0); out.push([c, v, v + len - 1]); v += len; }

  })();
  function psRound(){
    var r = 1; all("psread", "hh").forEach(function(x){ if(x.round > r) r = x.round; });

  function tickPsalm(r, i, on){ put(Object.assign({}, get("hh", "ps-" + r + "-" + i) || { type:"psread", id:"ps-" + r + "-" + i, space:"hh", round:r, idx:i }, { done:on, date:today(), by:myUid() })); }

  /* ---------- White Book (personal) ---------- */
  function wbs(){ return all("wb", mySpace()).sort(function(a, b){ return (b.start || "").localeCompare(a.start || "") || (b.created || 0) - (a.created || 0); }); }

  /* ---------- Coming back from the Bible app: #done=<rid> ---------- */

    "r-psalm": function(el){ var r = +el.dataset.r, i = +el.dataset.i; tickPsalm(r, i, !psDone(r, i)); buzz(15); render(); },

    "area-cancel": function(){ editArea = null; renderGoals(); },

    "goal-add": function(el){ put({ type:"goal", id:"g-" + uid(), space:"hh", areaId:el.dataset.id, text:"New goal", kind:"milestones", due:dayKey(new Date(new Date().getFullYear() + 1, 10, 30)), order:areaGoals(el.dataset.id).length + 1 }); renderGoals(); },
    "goal-del": function(el){ var g = all("goal", "hh").filter(function(x){ return x.id === el.dataset.id; })[0]; if(!g || !confirm("Delete this goal and its milestones?")) return; goalMs(g.id).forEach(del); del(g); renderGoals(); },
    "goal-confirm": function(el){ var g = all("goal", "hh").filter(function(x){ return x.id === el.dataset.id; })[0]; if(g && confirm("Keep this goal as it is? (Edit the wording first if you want to change it.)")){ patch(g, { suggested:"" }); renderGoals(); } },
    "goal-measure": function(el){ var g = all("goal", "hh").filter(function(x){ return x.id === el.dataset.id; })[0]; if(!g) return; var v = prompt("Current value" + (g.unit ? " (" + g.unit + ")" : ""), g.current != null ? g.current : g.start); if(v == null || v.trim() === "" || isNaN(+v)) return; patch(g, { current:+v, log:(g.log || []).concat([{ date:today(), v:+v }]).slice(-60) }); renderGoals(); },
    "ms-show": function(el){ var r = document.querySelector('.add-row[data-goal="' + el.dataset.id + '"]'); if(r){ r.style.display = "flex"; el.style.display = "none"; r.querySelector("input").focus(); } },
    "ms-add": function(el){ var r = document.querySelector('.add-row[data-goal="' + el.dataset.id + '"]'), t = r.querySelector("input[type=text]").value.trim(), d = r.querySelector("input[type=date]").value; if(!t) return; var g = all("goal", "hh").filter(function(x){ return x.id === el.dataset.id; })[0]; put({ type:"ms", id:"ms-" + uid(), space:"hh", goalId:el.dataset.id, areaId:g ? g.areaId : "", text:t, due:d, done:false }); renderGoals(); },
    "ms-tick": function(el){ var m = get("hh", el.dataset.id); if(!m) return; patch(m, { done:!m.done, doneAt:!m.done ? today() : "" }); buzz(15); render(); },
    "ms-del": function(el){ var m = get("hh", el.dataset.id); if(m && confirm("Delete this milestone?")){ del(m); renderGoals(); } },
    "rv-week": function(el){ var cur = rvWeek || mondayOf(); var n = dayKey(addDays(parseDay(cur), 7 * (+el.dataset.d))); rvWeek = n > mondayOf() ? mondayOf() : n; renderReview(); },
    "rv-open": function(el){ rvWeek = el.dataset.week; renderReview(); window.scrollTo(0, 0); },
    "rv-save": function(el){ saveReview(el.dataset.week); },
    "sync-now": function(){ sync().then(function(){ renderSettings(); toast(syncState === "ok" ? "Up to date" : (syncErr || "Couldn't sync")); }); },
    "sign-in-sheet": function(){ signInSheet(); },
    "si-who": function(el){ siWho = el.dataset.uid; signInSheet(); },
    "sign-in": function(){
      var p = ($("si-pin") || {}).value || "", err = $("si-err");
      if(!siWho || !/^\d{4,8}$/.test(p)){ err.textContent = "Enter your PIN (4–8 digits)."; return; }
      err.style.color = "var(--ink-dim)"; err.textContent = "Signing in…";
      signIn($("si-api").value, siWho, p).then(function(){ closeSheet(); toast("Signed in — saving to the cloud"); }, function(x){ err.style.color = "var(--danger)"; err.textContent = x.message; });
    },
    "sign-out": function(){ if(confirm("Sign out? Anything not yet sent will be lost from this device.")) signOut(); },
    "dur-plan": function(el){ durPlan = el.dataset.k; renderSettings(); },
    "dur-reset": function(){ var o = Object.assign({}, getOverrides()); delete o[durPlan]; setPref("ov", o); renderSettings(); toast("Durations reset"); },
    "oldaff-edit": function(){ openSheet('<h2>Character affirmations</h2><textarea id="oa-text" spellcheck="false">' + esc((prefs().oldAff || DEFAULT_AFFIRMATIONS).join("\n")) + '</textarea><div class="help">One per line. A short line with no full stop shows as a heading. Wrap a word in **double asterisks** to highlight it.</div><div class="btn-row"><button class="btn btn-soft" data-act="oa-reset">Restore defaults</button><button class="btn btn-ink" data-act="oa-save">Save</button></div>'); },
    "oa-save": function(){ var l = $("oa-text").value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean); setPref("oldAff", l.length ? l : DEFAULT_AFFIRMATIONS.slice()); closeSheet(); toast("Saved"); },
    "oa-reset": function(){ $("oa-text").value = DEFAULT_AFFIRMATIONS.join("\n"); },
    "folio-sheet": function(){ folioSheet(); },
    "folio-import": function(){ folioImport(); },
    "export": function(){
      var data = { app:"Miracle Morning", version:APP_VERSION, exportedAt:new Date().toISOString(), items:Object.keys(store).map(function(k){ return store[k]; }) };
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type:"application/json" })); a.download = "miracle-morning-backup-" + today() + ".json"; a.click();
    },
    "install": function(){ if(!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt = null; renderInstall(); }); },
    "sheet-close": function(){ closeSheet(); }
  };
  Object.assign(actions, readActions);
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]"); if(!el) return;
    var f = actions[el.dataset.act]; if(f){ e.preventDefault(); f(el, e); }
    if(session){ var sr = document.querySelector("#s-body .s-read"); if(sr) sr.innerHTML = sReadInner(); }
  });
  $("sheet-bg").addEventListener("click", closeSheet);
  document.addEventListener("change", function(e){
    var el = e.target, c = el.dataset.chg;
    if(el.id === "folio-file" && el.files[0]) folioPreview(el.files[0]);
    if(el.matches && el.matches('select[data-f="kind"]')){ var m = el.closest("[data-gid]").querySelector("[data-meas]"); if(m) m.style.display = el.value === "measured" ? "" : "none"; }
    if(!c) return;
    if(c === "wake") setWake(el.checked);
    if(c === "sound"){ setSound(el.checked); if(el.checked) playChime("soft"); }
    if(c === "vibe"){ setVibe(el.checked); if(el.checked) buzz(60); }
    if(c === "oldaff") setPref("showOldAff", el.checked);
    if(c === "name"){ var v = el.value.trim() || "Andrew"; setPref("name", v); if(signedIn()){ cfg.user.name = v; saveCfg(); } renderHero(currentView); }
    if(c === "dur"){ var mins = parseFloat(el.value); if(isNaN(mins) || mins <= 0) mins = 0.25; var sec = Math.round(mins*60), o = JSON.parse(JSON.stringify(getOverrides())); o[durPlan] = o[durPlan] || {}; o[durPlan][el.dataset.name] = sec; setPref("ov", o); el.value = Math.round(sec/60*100)/100; }
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Enter" && e.target.id === "si-pin") actions["sign-in"](); });
  document.addEventListener("input", function(e){ var box = e.target.closest && e.target.closest(".s-scribe"); if(box && e.target.dataset.sc) scribeSave(box); });
  document.querySelectorAll("#tabbar button").forEach(function(b){ b.addEventListener("click", function(){ rvWeek = null; showView(b.dataset.view); }); });
  $("btn-settings").addEventListener("click", function(){ showView("more"); });
  $("btn-start").addEventListener("click", function(){ startSession(getPlanKey()); });
  setInterval(function(){ if(currentView === "home" && !session) $("plan-ends").textContent = clockTime(Date.now() + total(getSteps(getPlanKey()))*1000); }, 30000);
  window.addEventListener("online", function(){ if(signedIn()) sync(); });
  window.addEventListener("pagehide", persistNow);

  /* ================= Start ================= */
  migrateV2();
  seedGoals();
  setSyncState(signedIn() ? "wait" : "off");
  handleReturn();
  showView(currentView);
  window.addEventListener("hashchange", function(){ if(/^#(done=|back)/.test(location.hash)){ handleReturn(); showView(currentView); } });
  setInterval(function(){ if(currentView === "home" && !session) renderTodayReading(); }, 5 * 60000);
  syncWake();
  document.addEventListener("pointerdown", function once(){ syncWake(); document.removeEventListener("pointerdown", once); }, {passive:true});
  if(signedIn()){ sync(); setInterval(function(){ if(document.visibilityState === "visible") sync(); }, 30000); }
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
